# 두 공개 소스가 다루지 않는 학회의 일정. 최우선 소스다.
# year를 반드시 명시하며, 그 연차에만 적용된다.
#
# 결합 행(iccv/eccv, asru/slt처럼 격년으로 번갈아 열리는 쌍)에 대한 항목은
# 그룹 키("asru/slt")가 아니라 구성원 이름(예: "asru", "slt")으로 적는다.
# 그룹 키로 적으면 어느 구성원의 회차인지 알 수 없어 빌드가 경고와 함께
# 버린다 — 예를 들어 실제로는 ASRU의 일정인데 대표로 뽑힌 SLT 이름표가
# 붙어 표시되는 사고를 막기 위해서다.
#
# 여기 적힌 값은 ai-deadlines/ccfddl 같은 업스트림과 대조할 방법이 없다.
# 즉 이 파일 하나가 틀리면 빌드도 테스트도 그 오류를 잡지 못하고 그대로
# 사이트에 실린다 — 실제로 HRI 2026 항목이 계획 문서의 예시(가상의 날짜와
# 장소)를 그대로 베껴 적은 채 여러 차례 리뷰를 통과해 배포된 적이 있다.
# 그러니 항목을 적거나 고칠 때는 반드시 해당 학회의 공식 사이트에서 값을
# 하나하나 확인하고, 확인할 수 없는 값(특히 마감일)은 추측해서 채우지 말고
# 비워 둔다.
conferences:
  hri:
    editions:
      # 공식 사이트(https://humanrobotinteraction.org/2026/)에서 확인:
      # 본 학회는 Edinburgh International Conference Centre, 워크숍은
      # Heriot-Watt University에서 진행 - 다른 33개 행의 place가 도시/국가
      # 두세 단어로 끝나는 것과 형식을 맞추기 위해 이 장소 세부 정보는
      # place에 넣지 않고 여기 주석에만 남긴다. 마감은 full-papers 페이지의
      # "Submission Deadline (only if you submitted the abstract before
      # Sep 22): September 30, 2025, 11:59 pm AoE"로 확인.
      - year: 2026
        date_text: "March 16-19, 2026"
        start: 2026-03-16
        end: 2026-03-19
        place: "Edinburgh, Scotland"
        link: "https://humanrobotinteraction.org/2026/"
        deadlines:
          - type: paper
            label: "Full Paper"
            date: "2025-09-30 23:59:59"
            timezone: AoE
      # 공식 사이트(https://humanrobotinteraction.org/2027/)에서 확인: "The
      # 22nd Annual IEEE/ACM International Conference on Human-Robot
      # Interaction (HRI 2027) will be held in Santa Clara, California, USA,
      # from March 8-12, 2027." 마감 9개는 각 트랙 페이지에서 확인했고,
      # full-papers 페이지가 "All deadlines are 23:59 AoE"라고 명시한다.
      # type은 nextDeadline이 paper 타입을 최우선으로 고르므로 Full Papers
      # 제출만 paper로 두고, 다른 트랙은 submission/workshop/demo로 구분한다
      # (docs/lib.js의 paperCandidates, scripts/models.py의 PAPER_TYPES 참고).
      - year: 2027
        date_text: "March 8-12, 2027"
        start: 2027-03-08
        end: 2027-03-12
        place: "Santa Clara, California, USA"
        link: "https://humanrobotinteraction.org/2027/"
        deadlines:
          - type: abstract
            label: "Abstract"
            date: "2026-09-11 23:59:59"
            timezone: AoE
          - type: paper
            label: "Full Papers"
            date: "2026-09-18 23:59:59"
            timezone: AoE
          - type: submission
            label: "Short Contributions"
            date: "2026-10-01 23:59:59"
            timezone: AoE
          - type: submission
            label: "alt.HRI"
            date: "2026-10-01 23:59:59"
            timezone: AoE
          - type: workshop
            label: "Workshops & Tutorials"
            date: "2026-10-05 23:59:59"
            timezone: AoE
          - type: submission
            label: "Industry White Papers"
            date: "2026-10-10 23:59:59"
            timezone: AoE
          - type: submission
            label: "HRI Pioneers"
            date: "2026-10-18 23:59:59"
            timezone: AoE
          - type: demo
            label: "Videos and Demos"
            date: "2026-11-20 23:59:59"
            timezone: AoE
          - type: submission
            label: "Student Design Competition"
            date: "2026-11-20 23:59:59"
            timezone: AoE
  ijcai:
    editions:
      # 공식 사이트(https://www.ijcai.org/future_conferences)에서 확인:
      # "The third IJCAI-27 will be held in Kyoto, Japan from August 7th
      # until August 13th, 2027 and in Hengqin, China from August 15th
      # until August 17th, 2027." 두 도시에 걸친 한 회차로 표시.
      # 마감: ijcai.org와 future_conferences 페이지를 다시 확인함 - 마감
      # 언급 없음. IJCAI-27 전용 사이트로 가는 링크도 아직 없음. 검색에
      # "2027-02-01"을 마감으로 제시하는 결과가 있었으나 출처가 submitforge.
      # com/mlciv.com 같은 제3자 집계 사이트(추정치)일 뿐 공식 발표가 아니라
      # 채택하지 않았다.
      #
      # place: 두 도시라 콤마 정리(normalize_place)를 기계적으로 거치면
      # "Kyoto Japan & Hengqin China"가 된다 - 확인해 보니 두 콤마를 그냥
      # 지운 결과가 오히려 자연스럽게 읽혀서 별도 손질 없이 그대로 둔다.
      - year: 2027
        date_text: "Aug 7-13, 2027 Kyoto, Japan & Aug 15-17, 2027 Hengqin, China"
        start: 2027-08-07
        end: 2027-08-17
        place: "Kyoto, Japan & Hengqin, China"
        link: "https://www.ijcai.org/future_conferences"
        deadlines: []
  rss:
    editions:
      # 공식 사이트(https://roboticsconference.org/)에서 확인: "We look
      # forward to seeing you at RSS 2027 in Athens, Greece, July 6–11,
      # 2027!" 마감: roboticsconference.org와 /information/cfp/ 페이지를
      # 다시 확인함 - 둘 다 RSS 2026 마감(2026-01-30 등)만 있고 2027 마감
      # 언급 없음. 검색에 "과거 패턴 기반 예측"이라는 제3자 결과가 있었으나
      # 공식 발표가 아니라 채택하지 않았다.
      - year: 2027
        date_text: "July 6-11, 2027"
        start: 2027-07-06
        end: 2027-07-11
        place: "Athens, Greece"
        link: "https://roboticsconference.org/"
        deadlines: []
  # registry.yaml에는 이 학회의 abbr이 대문자 "ICME"로 적혀 있다(다른
  # 항목은 대부분 소문자). manual의 키는 registry의 abbr과 대소문자까지
  # 그대로 일치해야 매칭되므로 여기서도 "ICME"로 적는다.
  ICME:
    editions:
      # 공식 링크(ieee-cas.org의 이벤트 페이지)는 이 저장소의 자동 조회가
      # 403을 반환해 직접 열람하지 못했다. 저장소 소유자가 브라우저로 직접
      # 열어 확인한 값("2027 IEEE International Conference on Multimedia &
      # Expo (ICME) · 13 July 2027 – 17 July 2027 · Xiamen, China")을 옮겨
      # 적었다. 별도로 showsbee.com(제3의 학회 일정 목록 사이트)에서 같은
      # 날짜/장소를 다시 확인했다("Tuesday, July 13, 2027 - Saturday,
      # July 17, 2027", "Xiamen, Xiamen, China"). 페이지 자체에 "More
      # details to come"라고 적혀 있어 마감 미발표.
      #
      # 주의: "ICME 2027"로 검색하면 TMS의 World Congress on Integrated
      # Computational Materials Engineering(2027-06-13~17, 시카고, 재료공학
      # 학회)도 같은 약어로 걸린다. 여기 적는 ICME는 IEEE 멀티미디어 학회
      # (registry의 field: Multimedia)이며 서로 다른 학회이니 헷갈리지
      # 말 것.
      - year: 2027
        date_text: "July 13-17, 2027"
        start: 2027-07-13
        end: 2027-07-17
        place: "Xiamen China"
        link: "https://ieee-cas.org/event/conference/2027-ieee-international-conference-multimedia-expo-icme"
        deadlines: []
  sigir:
    editions:
      # 공식 사이트(https://sigir2027.org/)가 이 저장소의 자동 조회에는
      # Cloudflare 522를 반환해 직접 열람하지 못했다. 저장소 소유자가
      # 브라우저로 직접 확인한 문구("Join us for the ACM SIGIR 2027
      # conference celebrating 50 years of innovation. July 18-24 in
      # Silicon Valley!")를 옮겨 적었다. 검색으로 찾은 SIGIR 커뮤니티
      # 구성원들의 공개 게시물도 같은 값(실리콘밸리, 2027)을 언급해 보강
      # 확인했지만, 공식 페이지 원문을 이 저장소가 직접 읽은 것은 아니다.
      # 마감 미발표.
      - year: 2027
        date_text: "July 18-24, 2027"
        start: 2027-07-18
        end: 2027-07-24
        place: "Silicon Valley USA"
        link: "https://sigir2027.org/"
        deadlines: []
  dis:
    editions:
      # ccfddl(conference/HI/dis.yml)은 2026까지만 있어 2027을 여기서 채운다.
      # 전부 공식 사이트에서 확인한 값이다.
      #
      # https://dis.acm.org/2027/call-for-papers/ "Important Dates":
      #   Title and Abstract | 11 January 2027
      #   Paper and Pictorial Submission | 18 January 2027
      #   Acceptance Notification | 19 March 2027
      #   DIS 2027 Conference | 28 June - 2 July 2027
      #   "Deadlines are specified as Anywhere on Earth time"
      # https://dis.acm.org/2027/ 에서 장소 확인:
      #   "Stockholm, Sweden, June 28th - July 2nd 2027"
      # https://dis.acm.org/2027/workshops/ "Important Dates":
      #   Workshop Submission Due February 1st, 2027
      #   Acceptance Notification February 16th, 2027
      # https://dis.acm.org/2027/interactivity-arts/ "Important Dates":
      #   Submission Deadline February 19th, 2027
      #
      # 워크숍은 제안 마감(2/1)이 아니라 채택 발표(2/16)를 싣는다 - 제안은
      # 워크숍 주최자가 내는 것이라, 참가자에게 의미 있는 날은 어떤 워크숍이
      # 열리는지 알게 되는 날이다. Interactivity & Arts는 본 논문 마감 뒤에도
      # 남는 제출 트랙이라 demo로 둔다(docs/lib.js의 LATE_SUBMISSION_TYPES).
      # Doctoral Consortium 페이지에는 아직 날짜가 없어 비워 둔다.
      - year: 2027
        date_text: "June 28 - July 2, 2027"
        start: 2027-06-28
        end: 2027-07-02
        place: "Stockholm, Sweden"
        link: "https://dis.acm.org/2027/"
        deadlines:
          - type: abstract
            label: "Title and Abstract"
            date: "2027-01-11 23:59:59"
            timezone: AoE
          - type: paper
            label: "Paper and Pictorial Submission"
            date: "2027-01-18 23:59:59"
            timezone: AoE
          - type: demo
            label: "Interactivity & Arts Submission Deadline"
            date: "2027-02-19 23:59:59"
            timezone: AoE
          - type: notification
            label: "Workshop Acceptance Notification"
            date: "2027-02-16"
          - type: notification
            label: "Acceptance Notification"
            date: "2027-03-19"

