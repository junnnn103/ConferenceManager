name: build

on:
  schedule:
    # 일요일 21:00 UTC = 월요일 06:00 KST. 주 1회.
    # 마감 D-day는 브라우저가 뷰어의 시계로 계산하므로 매일 빌드할 필요가 없다.
    # 이 실행이 하는 일은 업스트림 두 저장소의 변경을 받아오는 것뿐이다.
    - cron: "0 21 * * 0"
  workflow_dispatch:
  push:
    branches: [master, main, feature/conference-tracker]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: pip install -e ".[dev,bootstrap]"

      - name: Python 테스트
        run: python -m pytest -q

      - name: JS 테스트
        run: node --test tests/js/

      # 커밋된 CFP 데이터가 여전히 게이트를 통과하는지 다시 확인한다.
      # 네트워크를 타지 않으므로 비용이 없고, 손으로 편집된 값이
      # 게이트를 우회하는 것을 막는다.
      - name: CFP 데이터 재검증
        run: python -m scripts.validate_scraped

      - name: 빌드
        run: python -m scripts.build

      - name: 변경분 커밋
        run: |
          # generated_at은 매 빌드마다 바뀌므로 이 줄만 다르면 "변경 없음"으로
          # 본다 - 안 그러면 이 워크플로가 매일 실속 없는 커밋을 만들고,
          # 그 커밋이 다른 push와 겹치면 충돌까지 난다(실제로 겪은 일이다).
          # conferences.json은 build.py가 json.dumps(..., indent=2)로 쓰므로
          # generated_at이 한 줄을 통째로 차지한다 - -I 옵션이 정확히 그
          # 줄만 걸러낸다. data/scraped는 generated_at이 없으므로 그대로
          # --quiet로 본다.
          if git diff --quiet -I'"generated_at"' -- docs/data/conferences.json \
              && git diff --quiet -- data/scraped; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/conferences.json
          # data/scraped는 마지막 태스크 전까지 저장소에 존재하지 않는다.
          # 없는 경로를 add하면 git이 실패하므로 있을 때만 추가한다.
          if [ -d data/scraped ]; then
            git add data/scraped
          fi
          git commit -m "학회 일정 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
