[project]
name = "conference-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
bootstrap = ["openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 자동 탐색에 맡기면 루트의 데이터 폴더(data, BK학회리스트 등)를 파이썬 패키지로
# 오인해 "Multiple top-level packages discovered" 오류로 설치가 실패한다.
# 실제 패키지는 scripts 하나뿐이므로 명시한다.
[tool.setuptools]
packages = ["scripts", "scripts.sources"]
