# 두 공개 소스가 다루지 않는 학회의 일정. 최우선 소스다.
# year를 반드시 명시하며, 그 연차에만 적용된다.
#
# 결합 행(iccv/eccv, asru/slt처럼 격년으로 번갈아 열리는 쌍)에 대한 항목은
# 그룹 키("asru/slt")가 아니라 구성원 이름(예: "asru", "slt")으로 적는다.
# 그룹 키로 적으면 어느 구성원의 회차인지 알 수 없어 빌드가 경고와 함께
# 버린다 — 예를 들어 실제로는 ASRU의 일정인데 대표로 뽑힌 SLT 이름표가
# 붙어 표시되는 사고를 막기 위해서다.
#
# 여기 적힌 값은 ai-deadlines/ccfddl 같은 업스트림과 대조할 방법이 없다.
# 즉 이 파일 하나가 틀리면 빌드도 테스트도 그 오류를 잡지 못하고 그대로
# 사이트에 실린다 — 실제로 HRI 2026 항목이 계획 문서의 예시(가상의 날짜와
# 장소)를 그대로 베껴 적은 채 여러 차례 리뷰를 통과해 배포된 적이 있다.
# 그러니 항목을 적거나 고칠 때는 반드시 해당 학회의 공식 사이트에서 값을
# 하나하나 확인하고, 확인할 수 없는 값(특히 마감일)은 추측해서 채우지 말고
# 비워 둔다.
conferences:
  hri:
    editions:
      # 공식 사이트(https://humanrobotinteraction.org/2026/)에서 확인:
      # 본 학회는 Edinburgh International Conference Centre, 워크숍은
      # Heriot-Watt University에서 진행. 마감은 full-papers 페이지의
      # "Submission Deadline (only if you submitted the abstract before
      # Sep 22): September 30, 2025, 11:59 pm AoE"로 확인.
      - year: 2026
        date_text: "March 16-19, 2026"
        start: 2026-03-16
        end: 2026-03-19
        place: "Edinburgh, Scotland (EICC; workshops at Heriot-Watt University)"
        link: "https://humanrobotinteraction.org/2026/"
        deadlines:
          - type: paper
            label: "Full Paper"
            date: "2025-09-30 23:59:59"
            timezone: AoE
      # 공식 사이트(https://humanrobotinteraction.org/)에서 확인: "The 22nd
      # Annual IEEE/ACM International Conference on Human-Robot Interaction
      # (HRI 2027) will be held in Santa Clara, California, USA, from
      # March 8-12, 2027." 마감 미발표.
      - year: 2027
        date_text: "March 8-12, 2027"
        start: 2027-03-08
        end: 2027-03-12
        place: "Santa Clara, California, USA"
        link: "https://humanrobotinteraction.org/"
        deadlines: []
