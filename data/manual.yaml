# 두 공개 소스가 다루지 않는 학회의 일정. 최우선 소스다.
# year를 반드시 명시하며, 그 연차에만 적용된다.
#
# 결합 행(iccv/eccv, asru/slt처럼 격년으로 번갈아 열리는 쌍)에 대한 항목은
# 그룹 키("asru/slt")가 아니라 구성원 이름(예: "asru", "slt")으로 적는다.
# 그룹 키로 적으면 어느 구성원의 회차인지 알 수 없어 빌드가 경고와 함께
# 버린다 — 예를 들어 실제로는 ASRU의 일정인데 대표로 뽑힌 SLT 이름표가
# 붙어 표시되는 사고를 막기 위해서다.
